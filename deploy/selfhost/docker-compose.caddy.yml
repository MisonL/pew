# Optional extension: Caddy terminates TLS in front of web.
# Usage: docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
volumes:
  caddy-data: {}
  caddy-config: {}
