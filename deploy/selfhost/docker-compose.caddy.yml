# Optional extension: Caddy terminates TLS in front of web.
# Usage: docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# The web ports override below removes the 0.0.0.0:7020 publish once Caddy
# fronts it (the hard-constraint list in the README); with Caddy in the
# compose network you do NOT need docker-compose.proxy.yml on top.
services:
  caddy:
    # Pinned patch version, matching the pin-patch rule the rest of the stack
    # follows (rqlite 10.5.3, oven/bun 1.4.3, node 22.23.4-slim).
    image: caddy:2.10.2
    # Without this the ONLY public entry point does not come back after a
    # host or docker-daemon restart: every backend service has
    # `restart: unless-stopped`, but the port override below removes web's
    # direct publish, so an unrestarted caddy leaves the site unreachable
    # with no healthcheck to report it.
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
  web:
    ports: !override []
volumes:
  caddy-data: {}
  caddy-config: {}
