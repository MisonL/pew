# Gitleaks configuration — suppress specific false-positive patterns in test files
# See: https://github.com/gitleaks/gitleaks#configuration
#
# `extend.useDefault = true` is mandatory, not decoration. Without it gitleaks
# does NOT merge its built-in rule set: `--config` REPLACES it, so a file with
# zero [[rules]] scans for nothing and every run prints "no leaks found".
# Verified with a repo holding a real `ghp_…` PAT: default rules alone report
# the leak, this file without extend reports none, with extend reports it again.
[extend]
useDefault = true

# --- Allowlist semantics, and why these entries have no `paths` ---
# gitleaks matches a finding against `paths` OR `regexes`, not both. A bare
# `__tests__/` therefore exempts EVERY secret inside any test directory — a
# real PAT committed under __tests__/ was silently ignored (verified). So each
# allowlist below is keyed on the exact dummy string only, wherever it appears.
# Keep every pattern narrow: a real credential must never match it.
[[allowlists]]
  description = "short fake pk_ API keys in test fixtures, anchored and length-capped"
  # All test tokens are short human-readable names like pk_test, pk_abc123,
  # pk_bad_key, etc. Real production keys are pk_ + 32 hex chars (35 chars
  # total) — this anchored regex only matches 1–20 chars after "pk_", so a
  # genuine production key can never be exempted.
  regexes = [
    '''^pk_[a-zA-Z0-9_]{1,20}$''',
  ]

[[allowlists]]
  description = "hardcoded test-secret / test-api-token dummy values"
  # Anchored: an unanchored substring lets a real credential whose value
  # merely CONTAINS "test-secret" be exempted (verified — a synthetic
  # generic-api-key value with "shared-secret" embedded was silently ignored).
  regexes = [
    '''^test-secret-abc123$''',
    '''^test-api-token$''',
    '''^test-read-secret$''',
    '''^test-secret$''',
  ]

[[allowlists]]
  description = "fake CLI-login redirect keys asserted in cli-auth tests"
  # The redirect contract under test literally reads `?api_key=<value>`, so the
  # keyword cannot be renamed away. gitleaks compares allowlist regexes against
  # the captured SECRET (the value after `api_key=`), not the whole line, so
  # these anchored dummy names are the only values the assertions allow.
  regexes = [
    '''^existing-key-[a-z0-9]{3}$''',
    '''^key-xyz$''',
  ]

[[allowlists]]
  description = "fake cloud tokens in d1-test-guard tests"
  regexes = [
    '''^tok-prod-xxx$''',
    '''^shared-secret$''',
    '''^shared-read-secret$''',
  ]
